data:
  raw_csv: "data/raw/solicitudes.csv"
  test_size: 0.2
  random_state: 42

nlp:
  ngram_min: 1
  ngram_max: 2
  max_features: 10000

models:
  naive_bayes:
    alpha: 0.5
  logistic_regression:
    C: 2.0
    class_weight: "balanced"
    max_iter: 1000
  random_forest:
    n_estimators: 200
    max_depth: 35
    class_weight: "balanced_subsample"