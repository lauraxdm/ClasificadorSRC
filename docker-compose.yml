services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-pqrs_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-pqrs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  trainer:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python src/pipeline.py
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/pqrs_db
      - PYTHONPATH=/app
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/pqrs_db
      - PYTHONPATH=/app
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      trainer:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata: